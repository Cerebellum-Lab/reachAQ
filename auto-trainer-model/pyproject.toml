[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer.model", "autotrainer.model.*"]
namespaces = true

[project]
name = "auto-trainer-model"
description = "Model objects and implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "auto-trainer-device",
]

[tool.setuptools_scm]
root = ".."  # temporary while embedded in autotrainer main repo
# also strip auto-trainer-core when moved as independent repo
write_to = "auto-trainer-model/src/autotrainer/model/version.txt"
git_describe_command = "git describe --tags --dirty --match 'v*' --abbrev=8"
