# NI BNC-2090A, as its own documentation describes it.
#
# Source: NI 372101A-01, BNC-2090A User Manual (January 2007), with the
# connector counts cross-checked against its specification appendix: 22 BNC
# connectors, a 29-position spring terminal block, and two 68-position
# connectors. The counts below match.
#
# Recorded caveats, so nobody re-derives them:
#   * The 29 spring positions are printed as two group headings, P0 and PFI,
#     above bare numerals rather than as full "P0.0" or "PFI 1" strings, so
#     block and label are kept apart here and a reader shows them together.
#   * NI's own manual disagrees with itself on the terminal type: the
#     specification appendix, the body text and the Figure 1-1 legend all say
#     spring, while the captions of Figures 2-5 and 2-6 say screw. Spring is
#     taken as correct on the weight of evidence.
#   * USER 1 and USER 2 land on nothing until somebody wires their spring
#     terminals to something, which is why their terminal is empty here
#     rather than guessed.
#   * There are no FS/GS switches on this block. Referencing is set by eight
#     SE/DIFF switches, one per AI n / AI n+8 pair, and one global RSE/NRSE
#     switch - which is worth knowing, because the card reports per channel
#     what the block sets per pair.
#   * PFI lines carry a second name on an M Series card: PFI 0 to PFI 7 are
#     also port1/line0 to line7, and PFI 8 to PFI 15 are also port2/line0 to
#     line7. That is the card's naming, not the block's, and it is recorded
#     here because otherwise a configuration written as port1/line0 reads as
#     a pin this block does not bring out when it is the PFI 0 connector.
#     Source: NI 372121F-01 prints both names on the BNC-2110 panel itself -
#     "PFI 1/P1.1", "PFI 9/P2.1" - which is NI asserting the equivalence. It
#     holds for the M Series cards this is used with; an AO Series card
#     numbers its digital lines differently and has no PFI alias.
#
# terminal is the card terminal the connector lands on, with no device
# prefix, and empty when it lands on nothing. The card decides what any of
# these labels means, and whether it means anything at all.

name: BNC-2090A
title: NI BNC-2090A
source: NI 372101A-01, BNC-2090A User Manual (January 2007)
bnc_count: 22
spring_positions: 29
pin68_connectors: 2
