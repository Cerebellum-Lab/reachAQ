[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[project]
name = "auto-trainer-tools"
description = "Autotrainer full application and libs"
license = { text = "MIT" }
requires-python = ">= 3.10"
dynamic = ["version"]
dependencies = [
    # requesting exact version for auto-trainer standalone projects,
    # given API can be still unstable.
    'auto-trainer-training == 0.9.27',
    # NB: auto-trainer-api is coming via auto-trainer-core

    # but not already for these, still parts of this repo:
    'auto-trainer-behavior',
    'auto-trainer-video',
    'auto-trainer-device',
    'auto-trainer-pyside',
    'auto-trainer-model',

    # NB: prefer to set dependencies version specifier(s) in this pyproject dependencies:

    'setuptools-scm >= 9.2.2, < 10',  # to allow get version from git when in editable mode,
    'h5py >= 3.8, < 4',
    'openpyxl >= 3.1, < 4',
    'requests >= 2.32, < 3',
    'keyring >= 24, < 25; python_version < "3.9"',
    'keyring >= 25, < 26; python_version >= "3.9"',
    # without requiring to `pip install -e .` everytime you checkout something.

    'importlib-resources; python_version < "3.10"',
    'importlib-metadata; python_version < "3.10"'
]


# following are currently in top level pyproject.toml :
# not sure if keep in top-level or move here yet...

