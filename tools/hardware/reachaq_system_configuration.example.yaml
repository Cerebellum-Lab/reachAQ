# reachAQ Dell/Ubuntu system configuration example.
# Replace camera serials, NI-DAQ device/channel names, model paths, and voltage limits with the bench rig values.
# CAN transport is configured through reachaq_hardware.env.example because the current CAN runtime reads environment.
# stimCam is explicitly present but disabled; Cameras 4-6 and web are omitted.
# The documented PXIe-1073 rig uses PXI1Slot5 (PXI-6221) for sampled inputs
# and PXI1Slot4 (PXI-6713) for laser analog outputs. Discover every target rig;
# aliases, serials, capabilities, and valid routes are not universal defaults.

!SystemConfiguration
version: 57
cameras:
- !CameraConfiguration
  id: 0
  name: left
  isEnabled: true
  isRecordEnabled: true
  recordMode: 1
  recordPrebufferDuration: 0.0
  isStillImageCaptureEnabled: false
  stillImageCaptureInterval: 0.0
  scheme: spinnaker
  host: '<LEFT_CAMERA_SERIAL>'
  port: 0
  path: ''
  params:
    fps: 150
    width: 256
    height: 256
    hbin: 4
    vbin: 4
    exposure: 175
    gain: 1
    gamma: 0.7
    primary: 'yes'
- !CameraConfiguration
  id: 1
  name: right
  isEnabled: true
  isRecordEnabled: true
  recordMode: 1
  recordPrebufferDuration: 0.0
  isStillImageCaptureEnabled: false
  stillImageCaptureInterval: 0.0
  scheme: spinnaker
  host: '<RIGHT_CAMERA_SERIAL>'
  port: 0
  path: ''
  params:
    fps: 150
    width: 256
    height: 256
    hbin: 4
    vbin: 4
    exposure: 175
    gain: 1
    gamma: 0.7
    primary: 'no'
- !CameraConfiguration
  id: 3
  name: stimCam
  isEnabled: false
  isRecordEnabled: false
  recordMode: 1
  recordPrebufferDuration: 0.0
  isStillImageCaptureEnabled: false
  stillImageCaptureInterval: 0.0
  scheme: spinnaker
  host: '<STIM_CAMERA_SERIAL>'
  port: 0
  path: ''
  params:
    fps: 150
    width: 256
    height: 256
    hbin: 4
    vbin: 4
    exposure: 175
    gain: 1
    gamma: 0.7
    primary: 'no'
hardware: !HardwareConfiguration
  tunnelIdentifier: ''
  pelletIdentifier: CAN
  canEnabled: true
  pelletControllerEnabled: true
  nidaqEnabled: true
  tunnelHeadfixEnabled: false
  minAckTimeout: 3.0
  boardStatusTimeout: 15.0
inference: !InferenceConfiguration
  poseModelLocation: /opt/reachaq/models/reach_pose_model
  isEnabled: true
  intersessionWaitTime: 2.0
laser: !LaserSystemConfiguration
  # The PXI-6713 has analog outputs but no analog inputs. Keep laser feedback disabled
  # until a supported analog-input device is configured for diode/command-copy inputs.
  backend: disabled
  hardwareTimed: false
  sampleRateHz: null
  pmtShutterOutput: null
  triggerListenerInputs: []
  channels: []
nidaqPorts: !NidaqPortConfiguration
  deviceName: PXI1Slot5
  tone1: PXI1Slot5/port0/line0
  tone2: PXI1Slot5/port0/line1
  tone3R: PXI1Slot5/port0/line2
  tone3L: PXI1Slot5/port0/line3
  camFrames: PXI1Slot5/port0/line4
  barcode: PXI1Slot5/port0/line5
  # Saving through Edit DAQ Ports fills productType and serialNumber from
  # discovery. Do not copy a serial number from another rig.
  deviceIdentities:
  - !NidaqDeviceIdentity
    logicalName: acquisition-input
    runtimeName: PXI1Slot5
    productType: null
    serialNumber: null
  timing: !NidaqTimingConfiguration
    syncMode: auto
    timingMaster: null
    requireHardwareSynchronization: true
    referenceClockSource: null
    startTriggerSource: null
    sampleClockSource: null
nidaqStream: !NidaqSignalStreamConfiguration
  # Every channel is continuously acquired and persisted during Record. The
  # display selection below controls plots only.
  isEnabled: true
  sampleRateHz: 10000.0
  readChunkSize: 500
  rollingWindowSeconds: 10.0
  channels:
  - !NidaqSignalChannelConfiguration
    name: tone1
    physicalChannel: PXI1Slot5/port0/line0
    kind: digital
  - !NidaqSignalChannelConfiguration
    name: tone2
    physicalChannel: PXI1Slot5/port0/line1
    kind: digital
  - !NidaqSignalChannelConfiguration
    name: tone3_r
    physicalChannel: PXI1Slot5/port0/line2
    kind: digital
  - !NidaqSignalChannelConfiguration
    name: tone3_l
    physicalChannel: PXI1Slot5/port0/line3
    kind: digital
  - !NidaqSignalChannelConfiguration
    name: cam_frames
    physicalChannel: PXI1Slot5/port0/line4
    kind: digital
  - !NidaqSignalChannelConfiguration
    name: barcode
    physicalChannel: PXI1Slot5/port0/line5
    kind: digital
  displayChannels:
  - cam_frames
  - barcode
behavior: !BehaviorConfiguration
  pelletDelivery: !PelletDeliveryConfiguration
    isEnabled: false
    isPelletCoverEnabled: true
    isIntersessionAnalysisEnabled: true
    maxPelletMissingSeconds: 15.0
  headClamp: !HeadClampConfiguration
    enabled: false
    baselineIntensity: 0.0
    autoClampIntensity: 100
    autoClampReleaseToneFreq: 7000
    autoClampReleaseToneDelay: 0.1
  headbarPressure: !HeadbarPressureConfiguration
    threshold: 20
    duration: 0.5
persistence: !PersistenceConfiguration
  outputLocation: /home/<USER>/Documents/rawdatalocal
watchdog: !WatchdogConfig
  timeoutTriggerDelay: 5.0
