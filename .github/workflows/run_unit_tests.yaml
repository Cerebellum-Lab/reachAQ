name: Run unit tests
on:
  push:
    branches:
      - feature-dev
      - devel
      - 'ci/**'
  pull_request:
    branches:
      - feature-dev
      - devel
  workflow_dispatch:
    inputs:
      pytest_extra_args:
        description: 'Extra args for pytest'
        required: true
        default: ''
        type: string
permissions:
  contents: read
concurrency:  # allow cancel if new commit pushed
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Setup env. and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.10"]
    env:
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false  # fetch LFS selectively in the step below, not the whole tree
          fetch-depth: 0  # required to fetch all history and all tags
          fetch-tags: true
      - name: Restore Git LFS objects
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.gitattributes', 'auto-trainer-inference/tests/**', 'tools/acquisition/view/*.png') }}
          restore-keys: |
            lfs-
      - name: Pull the LFS test data
        run: |
          git lfs pull --include="auto-trainer-inference/tests/**,tools/acquisition/view/*.png" --exclude="vendor/**"
          du -sh .git/lfs
          test "$(find .git/lfs/objects -type f | wc -l)" -eq 25
      - name: Save Git LFS objects
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.gitattributes', 'auto-trainer-inference/tests/**', 'tools/acquisition/view/*.png') }}
      - name: Install system libraries, ffmpeg and the Ubuntu font
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg fonts-ubuntu
      - name: Check the Ubuntu font is installed
        run: |
          fc-list : family | grep -qx Ubuntu
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and dependencies
        shell: bash  # this is to get color output
        env:
          TERM: xterm-256color
        run: |
          set -x
          pip config --user set install.progress_bar off
          pip config --user set install.color always
          pip config --user set global.color always
          # NB: colors only apply to some of pip error/warning messages, or its progress bar but we disabled it. 
          pip install --upgrade pip  # might be risky
          pip -V
          cat /home/runner/.config/pip/pip.conf
          pip install "torch>=2.7,<2.8" "torchvision>=0.22,<0.23" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Diagnostic LFS storage after install
        run: du -sh .git/lfs; find .git/lfs/objects -type f | wc -l
      - name: Check torch is the CPU build
        run: python -c "import torch,sys; print(torch.__version__); sys.exit(not torch.__version__.endswith('+cpu'))"
      - name: Licence check
        run: python -m tools.ci.check_licences --allowlist .github/licence-allowlist.txt
      - name: Show current version
        run: python -m setuptools_scm
      - name: Show auto-trainer and ensure we don't use sub-projects wheel(s)
        run: ./.check_sub_projects_not_installed.sh
      - name: Diagnostic LFS storage before pytest
        run: du -sh .git/lfs; find .git/lfs/objects -type f | wc -l
      - name: Test with pytest
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_EXTRA_ARGS: ${{ github.event.inputs.pytest_extra_args }}
        run: |
          set -x
          export PYTEST_ADDOPTS="--color=yes"
          export COVERAGE_PROCESS_START="$PWD/.coveragerc"
          site_pkgs_dir=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "import coverage; coverage.process_startup()" > "${site_pkgs_dir}/usercustomize.pth"
          coverage run -m pytest auto-trainer-core/tests auto-trainer-video/tests auto-trainer-inference/tests auto-trainer-device/tests tests tools/acquisition/tests -q -p no:randomly -rs $PYTEST_EXTRA_ARGS
      - name: Diagnostic LFS storage after pytest
        if: ${{ !cancelled() }}
        run: du -sh .git/lfs; find .git/lfs/objects -type f | wc -l
      - name: Coverage
        if: ${{ !cancelled() }}
        run: |
          set -x
          coverage combine
          coverage html
          #
          echo "FULL COVERAGE"
          coverage report
          #
          # extra detail:
          echo
          for module in tools/acquisition $(find . -type d -name "auto-trainer-*" | sort)
          do
            # need relative to ./ (strip front ./) :
            module=$(realpath -s --relative-to ./ "${module}")
            echo "${module} COVERAGE"
            with_auto_trainer_src_dir="${module}/src/autotrainer"
            if test -d "${with_auto_trainer_src_dir}"
            then
              include="${with_auto_trainer_src_dir}/*"
            else
              include="${module}/*"
            fi
            coverage report --include="${include}" || true
            echo
          done
      - name: Upload HTML coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
