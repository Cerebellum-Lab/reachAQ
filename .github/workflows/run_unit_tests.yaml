name: Run unit tests
on:
  push:
    branches:
      - feature-dev
      - devel
      - 'ci/**'
  pull_request:
    branches:
      - feature-dev
      - devel
  workflow_dispatch:
    inputs:
      pytest_extra_args:
        description: 'Extra args for pytest'
        required: true
        default: ''
        type: string
permissions:
  contents: read
concurrency:  # allow cancel if new commit pushed
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Setup env. and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.10"]
    env:
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false  # fetch LFS selectively in the step below, not the whole tree
          fetch-depth: 0  # required to fetch all history and all tags
          fetch-tags: true
      - name: Restore Git LFS objects
        id: lfs-cache
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.gitattributes', 'tests/inference/**', 'src/reachaq/app/view/*.png') }}
          restore-keys: |
            lfs-
      - name: Pull the LFS test data
        shell: bash  # -eo pipefail: a failing ls-files must fail the step, not feed jq nothing
        run: |
          git lfs pull --include="tests/inference/**,src/reachaq/app/view/*.png"
          du -sh .git/lfs
          find .git/lfs/objects -type f | wc -l
          git lfs ls-files --json --include="tests/inference/**,src/reachaq/app/view/*.png" | jq -e '(.files | length) > 0 and all(.files[]; .checkout == true and .downloaded == true)'
      - name: Save Git LFS objects
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}
      - name: Install system libraries, ffmpeg and the Ubuntu font
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg fonts-ubuntu
      - name: Check the Ubuntu font is installed
        run: |
          fc-list : family | grep -qx Ubuntu
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and dependencies
        shell: bash  # this is to get color output
        env:
          TERM: xterm-256color
          GIT_LFS_SKIP_SMUDGE: '1'  # setuptools_scm runs git archive, which would download every LFS pointer
        run: |
          set -x
          pip config --user set install.progress_bar off
          pip config --user set install.color always
          pip config --user set global.color always
          # NB: colors only apply to some of pip error/warning messages, or its progress bar but we disabled it. 
          pip install --upgrade pip  # might be risky
          pip -V
          cat /home/runner/.config/pip/pip.conf
          pip install "torch>=2.7,<2.8" "torchvision>=0.22,<0.23" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Check torch is the CPU build
        run: python -c "import torch,sys; print(torch.__version__); sys.exit(not torch.__version__.endswith('+cpu'))"
      - name: Licence check
        run: python -m ci.check_licences --allowlist .github/licence-allowlist.txt
      - name: Show current version
        run: python -m setuptools_scm
      - name: Test with pytest
        id: pytest
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_EXTRA_ARGS: ${{ github.event.inputs.pytest_extra_args }}
        run: |
          set -x
          export PYTEST_ADDOPTS="--color=yes $PYTEST_EXTRA_ARGS"
          export COVERAGE_PROCESS_START="$PWD/.coveragerc"
          site_pkgs_dir=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "import coverage; coverage.process_startup()" > "${site_pkgs_dir}/usercustomize.pth"
          coverage run -m pytest tests/core tests/video tests/inference tests/device tests tests/app -q -p no:randomly -rs
      - name: Coverage
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        run: |
          set -x
          coverage combine
          coverage html
          #
          echo "FULL COVERAGE"
          coverage report
          #
          # extra detail:
          echo
          for module in $(find src/reachaq -mindepth 1 -maxdepth 1 -type d | sort)
          do
            echo "${module} COVERAGE"
            coverage report --include="${module}/*" || true
            echo
          done
      - name: Upload HTML coverage report
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: htmlcov
          path: htmlcov/
      - name: Hang diagnostics
        # A hung exit ends here: the job limit cancels the pytest step. The runner kills the
        # step's shell but not its children, so the wedged processes are still alive to dump.
        if: ${{ cancelled() && steps.pytest.outcome == 'cancelled' }}
        timeout-minutes: 3
        shell: bash
        run: |
          ps --ppid 2 -p 2 --deselect --forest -o pid,ppid,pgid,etimes,stat,wchan:24,comm,args || true
          pip install --quiet py-spy==0.4.1 || true
          for pid in $(pgrep -x coverage; pgrep -x python); do
            echo "::group::pid $pid $(tr '\0' ' ' < /proc/$pid/cmdline | cut -c1-120)"
            grep -E '^(SigCgt|SigPnd|ShdPnd|Threads):' /proc/$pid/status || true
            timeout -k 5 20 sudo "$(command -v py-spy)" dump --pid "$pid" || true
            echo "::endgroup::"
          done
  deeplabcut-plugin:
    name: DeepLabCut plugin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.10"]
    env:
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false  # the plugin tests need no LFS data
          fetch-depth: 0  # required to fetch all history and all tags (setuptools_scm)
          fetch-tags: true
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project, the DeepLabCut plugin and dependencies
        shell: bash
        env:
          TERM: xterm-256color
          GIT_LFS_SKIP_SMUDGE: '1'  # setuptools_scm runs git archive, which would download every LFS pointer
        run: |
          set -x
          pip config --user set install.progress_bar off
          pip config --user set install.color always
          pip config --user set global.color always
          pip install --upgrade pip  # might be risky
          pip -V
          pip install "torch>=2.7,<2.8" "torchvision>=0.22,<0.23" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
          # No [tensorflow] extra: the plugin tests need no TensorFlow. The AGPL YOLO plugin is never installed.
          pip install -e plugins/deeplabcut
      - name: Check torch is the CPU build
        run: python -c "import torch,sys; print(torch.__version__); sys.exit(not torch.__version__.endswith('+cpu'))"
      - name: Licence check
        run: python -m ci.check_licences --allowlist .github/licence-allowlist.txt
      - name: Test the plugin with pytest
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_EXTRA_ARGS: ${{ github.event.inputs.pytest_extra_args }}
        run: |
          set -x
          export PYTEST_ADDOPTS="--color=yes $PYTEST_EXTRA_ARGS"
          # Only this directory: the YOLO plugin's tests share test file basenames with it.
          pytest plugins/deeplabcut/tests -q -p no:randomly -rs
