[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer.behavior", "autotrainer.behavior.*"]
namespaces = true

[project]
name = "auto-trainer-behavior"
description = "Behavior model implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "auto-trainer-core",
    "auto-trainer-inference",

    'transitions >= 0.9.2, < 1',  # machine state transition handling

    'numpy >= 1.23.5, < 2',
]

[tool.setuptools_scm]
root = ".."  # temporary while embedded in autotrainer main repo
# also strip auto-trainer-behavior when moved as independent repo
write_to = "auto-trainer-behavior/src/autotrainer/behavior/version.txt"
git_describe_command = "git describe --tags --dirty --match 'v*' --abbrev=8"
