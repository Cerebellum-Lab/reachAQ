[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reachaq.pose_plugins.yolo", "reachaq.pose_plugins.yolo.*"]
namespaces = true

[project]
name = "reachaq-pose-yolo"
description = "YOLO-pose (Ultralytics) pose backend plugin for reachAQ"
# ultralytics is AGPL-3.0, and this distribution links it, so it carries the
# same licence rather than reachAQ's. Install it only where that is acceptable.
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [

    # The installed application; reachaq is folded into it by
    # its setup.py and is never installed on its own.
    "reachaq",

    'ultralytics >= 8.4, < 9',  # AGPL-3.0; brings torch

]

[project.entry-points."reachaq.pose_backends"]
yolo = "reachaq.pose_plugins.yolo.plugin:YOLO_PLUGIN"

[tool.setuptools_scm]
root = "../.."
git_describe_command = "git describe --tags --dirty --match 'v*' --abbrev=8"
# Without git metadata (a worktree read from WSL, an sdist) setuptools_scm
# cannot work out a version and the build fails; the plugin's version is not
# used for anything, so build as 0.0.0 instead.
fallback_version = "0.0.0"
