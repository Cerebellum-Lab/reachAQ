[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer.video", "autotrainer.video.*"]
namespaces = true

[project]
name = "auto-trainer-video"
description = "Video library for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    'auto-trainer-core',

    'numpy >= 1.23.5, < 2',
    'opencv-python >= 4.10, < 4.12',

    # FLIR/spinnaker camera
    'spinnaker-python >= 3.2, < 3.3 ; platform_machine == "aarch64"',
]

[tool.setuptools_scm]
root = ".."
write_to = "auto-trainer-video/src/autotrainer/video/version.txt"
git_describe_command = "git describe --tags --dirty --match 'v*' --abbrev=8"
