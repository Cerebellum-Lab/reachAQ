[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer.inference", "autotrainer.inference.*"]
namespaces = true

[project]
name = "auto-trainer-inference"
description = "Network implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [

    "auto-trainer-core",

    # DeepLabCut is not here: it ships in the auto-trainer-pose-deeplabcut
    # plugin (plugins/deeplabcut), with its TensorFlow extra.
    # Nor is YOLO (an AGPL-3.0 engine): it ships in the
    # auto-trainer-pose-yolo plugin (plugins/yolo).
    # The live keypoint backend needs nothing here: its framework comes from
    # the extra below, and its trainer reads frames with auto-trainer-video's
    # opencv-python.

    'pandas >= 2, < 3',
    'numpy >= 1.23.5, < 2',

    # Core imports both (analysis/prepare_jetson_data.py, calibration_FLIR.py);
    # they used to arrive only as deeplabcut's transitive dependencies.
    # PyTables: pandas to_hdf/read_hdf need it, and it too used to arrive only
    # through deeplabcut.
    'scipy >= 1.10, < 2',
    'scikit-learn >= 1.3, < 2',
    'tables >= 3.8, < 4',

]

[project.optional-dependencies]
# Installed alongside the DeepLabCut plugin's tensorflow extra by
# tools/install/reachaq-linux-install.sh; the conditions that makes safe are
# recorded beside that extra in plugins/deeplabcut/pyproject.toml.
torch = [
    'torch >= 2.7, < 2.8 ; platform_machine != "aarch64"',
    # 2.7 on a CUDA 12.8 build covers compute capability 7.5 through 12.0,
    # which is the whole known fleet: T1000 (7.5), RTX A2000 (8.6),
    # RTX 5060 Ti (12.0). Do not narrow this to one card. Capped below 2.8
    # because 2.7.1+cu128 is the build shown to share a process with
    # TensorFlow; a newer one needs that check repeated before the cap moves.
    'torch == 2.1.0a0+41361538.nv23.6 ; platform_machine == "aarch64"',
    # ensure we get/specify the desired version from nvidia for aarch64 ( == Jetson)

    'torchvision >= 0.22, < 0.23 ; platform_machine != "aarch64"',
]

[tool.setuptools_scm]
root = ".."
write_to = "auto-trainer-inference/src/autotrainer/inference/version.txt"
git_describe_command = "git describe --tags --dirty --match 'v*' --abbrev=8"
