[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer.inference", "autotrainer.inference.*"]
namespaces = true

[project]
name = "auto-trainer-inference"
description = "Network implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [

    "auto-trainer-core",

    'deeplabcut >= 3.0, < 4',  # famous deeplab; 3.x carries both engines
    # YOLO-pose models, the live model on christielab10. Imported lazily by
    # yolo_pose_model, so nothing failed at install time without it - live
    # inference failed at the first frame instead.
    'ultralytics >= 8.4, < 9',

    'pandas >= 2, < 3',
    'numpy >= 1.23.5, < 2',

]

[project.optional-dependencies]
# Both extras are installed together by tools/install/reachaq-linux-install.sh,
# which is the supported way to build an environment. Three conditions make
# that work, each found on christielab10 on 2026-09-24:
#   - TensorFlow's CUDA 11.8 / cuDNN 8.6 go in a directory of their own, not
#     site-packages/nvidia. The two frameworks' nvidia-* wheels install into
#     the same directory and the later one overwrote the earlier: TensorFlow
#     lost libcudnn.so.8 and fell back to the CPU without a word.
#   - torch must be a CUDA 12.8 build (the installer takes it from the PyTorch
#     cu128 index). DeepLabCut 3 imports torch on import, so the TensorFlow
#     engine always shares a process with it, and the CUDA 13 build aborted
#     TensorFlow there ("stack smashing detected").
#   - TensorFlow 2.12's numpy <= 1.24.3 and typing-extensions < 4.6 caps are
#     overridden: pyqtgraph, PyTables' blosc2 and albumentations need newer,
#     and TensorFlow 2.12.1 ran GPU convolutions and a DeepLabCut model with
#     numpy 1.26.4 and typing-extensions 4.16.
tensorflow = [
    'tensorflow >= 2.12, < 2.13 ; platform_machine != "aarch64"',
    # Capped below 2.13 deliberately: 2.13 pairs with a keras that moved
    # legacy_tf_layers, which breaks tf_slim's batch_norm and therefore every
    # DeepLabCut model load ("No module named 'keras.legacy_tf_layers'").
    'tensorflow == 2.12.0+nv23.06 ; platform_machine == "aarch64"',
    # aarch64 (Jetson) needs NVIDIA's index: a pip.conf extra-index-url or
    # PIP_EXTRA_INDEX_URL. Retained rather than removed; dropping Jetson
    # support is a separate scope decision.

    'tensorpack >= 0.11, < 1',
    'tf-slim >= 1.1, < 2',
    # NB: tensorpack and tf-slim are used/required by deeplabcut, even tough they are not depended on by it,
    # so we explicitly add them here.
    'imgaug >= 0.4, < 0.5',
    # DeepLabCut 3's TensorFlow engine imports imgaug and does not declare it.
]
torch = [
    'torch >= 2.7, < 2.8 ; platform_machine != "aarch64"',
    # 2.7 on a CUDA 12.8 build covers compute capability 7.5 through 12.0,
    # which is the whole known fleet: T1000 (7.5), RTX A2000 (8.6),
    # RTX 5060 Ti (12.0). Do not narrow this to one card. Capped below 2.8
    # because 2.7.1+cu128 is the build shown to share a process with
    # TensorFlow; a newer one needs that check repeated before the cap moves.
    'torch == 2.1.0a0+41361538.nv23.6 ; platform_machine == "aarch64"',
    # ensure we get/specify the desired version from nvidia for aarch64 ( == Jetson)

    'torchvision >= 0.22, < 0.23 ; platform_machine != "aarch64"',
]

[tool.setuptools_scm]
root = ".."
write_to = "auto-trainer-inference/src/autotrainer/inference/version.txt"
git_describe_command = "git describe --tags --dirty --match 'v*' --abbrev=8"
