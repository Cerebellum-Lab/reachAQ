# reachAQ overview deck — all slide copy.
#
# Edit this file and rerun `python docs/presentation/build_deck.py`. Nothing in
# the builder needs touching to change wording, reorder slides, add or drop one.
#
# Layouts:
#   cover    title + subtitle
#   bullets  title, optional lead line, bullet list
#   split    title, optional lead, two headed columns
#   image    title, optional lead, one asset, optional caption
#
# Every slide may carry `notes:` for the presenter view.
#
# Timing figures are rig measurements on an NVIDIA T1000 (Turing, no tensor
# cores) and are not claims about other cards. Two rules worth keeping if this
# copy is edited: the 5 ms stim figure is a budget and a tail figure, never an
# average; and model choice is a menu with a speed/accuracy trade, not a single
# winner - YOLO is the current default, not the only option.

meta:
  title: reachAQ
  subtitle: Automated mouse reach acquisition
  footer: reachAQ

slides:

  - layout: cover
    title: reachAQ
    subtitle: Automated mouse reach acquisition — what changed, and what it costs in milliseconds

  - layout: split
    title: What changed from reach-training
    lead: Same experiment. The difference is what the system can do while the reach is still happening.
    left_heading: reach-training
    left:
      - Reach detected by a brightness threshold inside a drawn ROI
      - Pellet arm driven by an Arduino over USB serial
      - Timing owned by a Python loop on the host
      - Signals inspected afterwards, from files
      - One flat protocol per experiment, delays drawn live
    right_heading: reachAQ
    right:
      - Two closed loops — a fast ROI reflex, and machine vision on the pose stream
      - Pellet arm on a CAN bus, with firmware capability checks and FSR pressure
      - Timing owned by hardware-timed NI-DAQ tasks and a real-time stim loop
      - Signals plotted live during the session, and recorded unfiltered
      - Experiments composed from reusable trial sets, with reproducible draws
    notes: >
      Keep this at the level of what the operator notices. The one sentence worth
      landing: reach-training watched and recorded, reachAQ decides and acts
      inside the same reach.

  - layout: bullets
    title: What came from auto-trainer
    lead: reachAQ is built on auto-trainer, not beside it. The architecture and most of the runtime are theirs.
    bullets:
      - The modular package split — core, video, device, inference, behavior, model, pyside — which is why hardware can be swapped without touching the rest
      - Per-process video capture with a shared synchronized frame index, so frame N means the same instant on every camera
      - Pose inference and FLIR stereo calibration, already integrated into the application rather than run afterwards
      - The CAN device abstraction, and the project, session and metadata structure that makes a recording self-describing
      - The PySide6 UI layer and its panel patterns
    notes: >
      Say plainly that we did not start over. reachAQ changed the hardware
      target, added stimulation and signal visualisation, and made the pose
      stream fast enough to act on. Everything underneath is auto-trainer's
      design.

  - layout: split
    title: Why pose could not close a loop before
    lead: Two cameras, two deadlines. The pose path missed its by a factor of eight.
    left_heading: What has to be fast
    left:
      - "Reach cameras run at 150 fps — a 6.667 ms per-frame budget for the pose stream"
      - "The stim camera runs at 900 Hz — a 5 ms budget for the reflex that fires the laser. That is a design target and a tail figure, not an average"
      - "The reflex detector's own compute is under 0.1 ms, so its problem was never arithmetic — it was the OS delivering it on time"
    right_heading: Where it started
    right:
      - "DeepLabCut on TensorFlow with ResNet-50 cost 54.8 ms per batch — about 18 Hz"
      - "That was the largest single latency term in the system, and roughly eight times over the frame budget"
      - "Pose could describe behaviour afterwards, but nothing could be decided from it while the reach was happening"
    notes: >
      This slide exists so the later numbers have something to be measured
      against. The user-facing consequence is the line that matters: before,
      pose was a recording product; now it is a control input. Keep 5 ms
      described as a budget and a tail figure, never an average.

  - layout: bullets
    title: What we changed
    lead: The wins came from removing our own overhead and letting each tier meet its own deadline — not from a faster runtime.
    bullets:
      - "Split the work in two. The reflex loop keeps its millisecond deadline; the pose stream is allowed to run slower than the cameras, because it informs behaviour rather than firing hardware"
      - "Gave the reflex loop real-time scheduling (SCHED_FIFO) and a performance CPU governor, so a busy machine cannot delay it"
      - "Stopped padding the inference batch — run the 2 real frames instead of a padded 6 — and rewrote the CPU decode to use argmax and numpy instead of a sort and pandas"
      - "Captured the CUDA graph for the live batch and replayed it, instead of re-submitting the same work every call"
      - "Made the pose stage unable to hurt acquisition: it takes frames on a separate non-blocking queue, always takes the newest and drops stale ones, so latency never grows into a backlog"
      - "Tried the usual accelerators and kept none of them — fp16, torch.compile and ONNX Runtime all measured at or below parity on this card, and TensorRT's real 1.3x was not worth a second inference path"
    notes: >
      This is the words-before-the-graph slide. Technical detail for the members
      who want it: partial batch and the lean predict path need the PyTorch
      engine, because the TensorFlow graph fixes its batch size; the ROI crop
      from 256 to 128 px is opt-in and worth about 2.6x on the forward pass;
      the decode rewrite and the freshness drain are always on and
      model-independent. The freshness drain alone took end-to-end from 17.6 to
      13.9 ms and cut frames the loop could not hand over from 35.2% to 0.7%.

  - layout: image
    title: What it measured
    lead: Same rig, same load, before and after each change.
    image: measurements.png
    caption: >
      Measured on an NVIDIA T1000 — a low-end Turing card with no tensor cores,
      which is why fp16 lost here and why a tensor-core GPU would shift several
      of these numbers.
    notes: >
      Left: under a 16-process load the reflex loop's worst case went from
      6.05 ms, which breaks the budget, to 0.155 ms with zero missed deadlines
      and the full 900 Hz cadence restored. No PREEMPT_RT kernel and no core
      pinning — both measured, both declined. Right: the three pose-stream
      changes, each shown against its own before. Units differ between rows,
      which is why they are labelled per row rather than sharing an axis.
      All figures are rig measurements on this hardware, not claims about
      other cards.

  - layout: split
    title: Pick the model that fits the experiment
    lead: The backend takes several model families. Speed and accuracy trade against each other, and the choice is yours per use case.
    left_heading: What you get to choose
    left:
      - "YOLO — the current default, and the one the CUDA-graph path accelerates"
      - "cspnext and rtmpose — top-down pose families with measured confidence thresholds per backbone"
      - "DeepLabCut ResNet-50 — the accuracy reference, and where this started"
    right_heading: What the choice costs
    right:
      - "Faster backbones hold camera rate: cspnext_s sustains 150 fps at 7.66 ms sensor-to-pose; cspnext_m runs near 103 fps"
      - "ResNet-50 runs below camera rate on this GPU — fine for a behaviour stream, not for closing a loop"
      - "Confidence does not mean the same thing across families, so the gate threshold is measured per backbone rather than set globally"
    notes: >
      The honest framing is a menu, not a winner. A user optimising for a tight
      closed loop picks differently from one optimising for keypoint accuracy in
      later analysis. The per-backbone threshold matters: a cspnext_s never
      scores above 0.33, so a single global threshold would hold the reach flag
      permanently false.

  - layout: split
    title: What this buys, and what it costs
    lead: The speed work was not the point. This is what it enabled.
    left_heading: New abilities
    left:
      - "A second closed loop driven by machine vision, alongside the fast ROI reflex — decisions can now depend on where the paw actually is"
      - "A live 2D pose overlay per camera view while the session runs"
      - "Signals visualised during acquisition instead of plotted afterwards"
      - "Experiments composed from reusable trial sets, with reproducible draws"
    right_heading: What it asks of you
    right:
      - "A working CUDA GPU. Live inference refuses to start without one, by design, rather than silently running slow"
      - "Two settings the installer applies: real-time scheduling for the reflex loop and the performance CPU governor"
      - "Calibration that matches the geometry the cameras actually record, or 3D is wrong beneath a correct-looking 2D overlay"
      - "Unfiltered signal recording costs disk — the FSR stream alone adds roughly 166 rows a second"
    notes: >
      If asked about flags: a default rig gets the always-on wins, the decode
      rewrite and the freshness drain, plus the Tier 1 scheduling. The partial
      batch and lean predict path need the PyTorch backend selected, and the ROI
      crop is opt-in.

  - layout: image
    title: Everything lands on one timebase
    lead: Cameras, tones, pellet events and laser output are not separately timestamped and hoped to agree.
    image: synchronization.png
    caption: >
      Camera frame edges are matched to NI-DAQ samples with a signed offset,
      a resolution, and a confidence — all written into alignment.json.
    notes: >
      Four sync modes: auto, backplane, external, independent. Compatible PXI
      cards share PXI_CLK10, a backplane start trigger and a routed master
      sample clock. Devices resolve by product and serial, so a changed NI-DAQmx
      alias never silently rebinds to the wrong card. Tone confirmation
      cross-checks commanded tones against the pulses actually observed.

  - layout: bullets
    title: Signals you can watch while the session runs
    lead: Everything is acquired continuously at 10 kHz and recorded unfiltered. The plot selection only changes what is drawn.
    bullets:
      - "Tones 1, 2 and 3 as logic traces, with the commanded onset checked against the pulse the DAQ actually saw"
      - "Pellet FSR pressure — two sensors at about 83 Hz each, from firmware 2.1.0, on their own stream rather than mixed into the device log"
      - "Laser analog command alongside the diode readback, so what was asked for and what came out are on the same axis"
      - "Camera frame pulses and the barcode line, which are what tie video to samples"
      - "Closed-loop state: what the pose gate answered, when the cue fired, and whether the trial was cancelled"
    notes: >
      The point for a new user is that this replaces post-hoc plotting. A
      decimated FSR trace is useless for behavioural analysis, so samples are
      forwarded unthrottled and an armed session gains roughly 166 rows a second.
      Worth flagging out loud: there is no microphone channel in the system today.

  - layout: bullets
    title: Experiments are composed, not copied
    lead: A phase shared by several experiments is written once.
    bullets:
      - "A trial set is a reusable group of trials, saved on its own — trial content only, no epochs or blocks"
      - "An experiment is an ordered list of set appearances; each entry pins the set revision it was built against, can repeat, and can shuffle trial order within an appearance"
      - "Compiling flattens it into an ordinary protocol document, so the runner, the schedule and session evidence see nothing new"
      - "Each appearance becomes a named epoch, and the Sources column names the set every value came from"
      - "Shuffle seeds are stored on the entry, so a compile can always be repeated exactly"
      - "Editing a set never repins an existing row; a stale pin is visible, and a compile against a changed set is refused rather than silently different"
    notes: >
      The pinning behaviour is the part worth dwelling on. It is what stops an
      edit to a shared phase from quietly changing an experiment that was
      already validated.

  - layout: image
    title: Demo — recorded video, everything else live
    lead: No animal today, so the camera frames are played from a recorded session. Exactly one stage is substituted.
    image: live_overlay.png
    caption: >
      Live 2D pose, per view, computed on the GPU from the played frames.
      Captured from the running application on the rig.
    notes: >
      Run order — launch with --demo or toggle Tools > Demo Mode while idle;
      show both camera panels carrying their own overlay; show the NI-DAQ signal
      stream; drive the pellet device by hand; open the protocol editor and the
      experiment sidebar; start a recording and let trials run; stop and show the
      session directory with its DEMO marker. Point at the red banner — it is
      there so nobody mistakes a demo session for data.
