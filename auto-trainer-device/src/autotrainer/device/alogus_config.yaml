pellet:
  load:
    min_pos: 0
    max_pos: 120
    min_pwm: 900
    max_pwm: 2100
    max_vel: 200.0
    max_acc: 100.0
  barrier:
    min_pos: 0
    max_pos: 120
    min_pwm: 900
    max_pwm: 2100
    max_vel: 200.0
    max_acc: 100.0
  x:
    flip_limit_orientation: 1
    microsteps: 8
    steps_per_revolution: 48.0
    max_vel: 20.0
    max_acc: 1000.0
  y:
    flip_limit_orientation: 0
    microsteps: 8
    steps_per_revolution: 48.0
    max_vel: 20.0
    max_acc: 1000.0
  z:
    flip_limit_orientation: 0
    microsteps: 8
    steps_per_revolution: 48.0
    max_vel: 20.0
    max_acc: 1000.0
actions:
  load:
    - type: load
      value: 100.0
    - type: delay
      value: 1.0
    - type: z
      value: 5.0
    - type: load
      value: 0.0
    - type: delay
      value: 1.0
    - type: z
      value: 0.0
    - type: delay
      value: 1.0
  send:
    - type: z
      value: .5
    - type: x
      value: 1.6
    - type: y
      value: 2.0
