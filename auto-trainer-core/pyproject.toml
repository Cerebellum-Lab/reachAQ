[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer.core", "autotrainer.core.*"]
namespaces = true

[project]
name = "auto-trainer-core"
description = "Core objects and implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.8"
dynamic = ["version"]

dependencies = [

    'auto-trainer-api == 0.11.0',

    "verboselogs >= 1.7, < 2",
    "coloredlogs >= 15, < 16",

    'events >= 0.5, < 1',   # dynamic events callback handling
    'transitions >= 0.9.2, < 1',  # machine state transition handling
    'psutil >= 7, < 8',  # for free disk space, notably

    'numpy >= 1.23.5, < 2',

    'pyhumps >= 3.8, < 4',  # snake/camel case converter
    'pyyaml >= 6.0.2, < 7',

    'importlib-resources; python_version < "3.10"',
    'importlib-metadata; python_version < "3.10"'
]

[tool.setuptools_scm]
root = ".."  # temporary while embedded in autotrainer main repo
# also strip auto-trainer-core when moved as independent repo
write_to = "auto-trainer-core/src/autotrainer/core/version.txt"
git_describe_command = "git describe --tags --dirty --match 'core-v*' --abbrev=8"
